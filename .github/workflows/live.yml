name: IBOS live data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ibos-live
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collect and publish live data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          IBOS_USER: ${{ secrets.IBOS_USER }}
          IBOS_PASS: ${{ secrets.IBOS_PASS }}
        run: |
          set -e
          # ensure the data branch exists (branch off main)
          if ! gh api "repos/$REPO/git/refs/heads/live-data" --jq .object.sha >/dev/null 2>&1; then
            MAIN=$(gh api "repos/$REPO/git/refs/heads/main" --jq .object.sha)
            gh api --method POST "repos/$REPO/git/refs" -f ref="refs/heads/live-data" -f sha="$MAIN" >/dev/null
          fi
          publish() {
            local F="$RUNNER_TEMP/live.json"
            [ -f "$F" ] || return 0
            local SHA C
            SHA=$(gh api "repos/$REPO/contents/live.json?ref=live-data" --jq .sha 2>/dev/null || true)
            C=$(base64 -w0 "$F")
            if [ -n "$SHA" ]; then
              gh api --method PUT "repos/$REPO/contents/live.json" \
                -f message="live $(date -u +%FT%TZ)" -f content="$C" -f branch=live-data -f sha="$SHA" >/dev/null
            else
              gh api --method PUT "repos/$REPO/contents/live.json" \
                -f message="live $(date -u +%FT%TZ)" -f content="$C" -f branch=live-data >/dev/null
            fi
            echo "published $(date -u +%T)"
          }
          # stay connected and publish every ~55s for ~4.5 min, then next cron run takes over
          for i in 1 2 3 4 5; do
            node collect-live.mjs "$RUNNER_TEMP/live.json" 8000 || true
            publish
            if [ "$i" -lt 5 ]; then sleep 50; fi
          done
